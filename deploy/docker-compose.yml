# 小装家 · 群晖 NAS 部署编排
# 用法：cd deploy && docker compose up -d
name: xiaozhuangjia

services:
  # ---------- 后端：FastAPI + uvicorn ----------
  backend:
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["sh", "/app/entrypoint.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+aiomysql://renovation:Wzcx131130_@172.17.0.1:3307/renovation}
      JWT_SECRET: ${JWT_SECRET:-xiaozhuangjia-jwt-secret}
      REFRESH_SECRET: ${REFRESH_SECRET:-xiaozhuangjia-refresh-secret}
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../backend:/app/backend:ro
      - ./backend-entrypoint.sh:/app/entrypoint.sh:ro
      - ../data/uploads:/app/frontend/public/assets/flow-images
      - ../data/venv:/app/venv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8003/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - zhuangxiu

  # ---------- 前端：nginx 托管静态文件 + 反代 /api ----------
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8007}:80"
      - "${HTTPS_PORT:-8008}:443"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /usr/syno/etc/certificate/_archive/Qi0mND:/etc/nginx/certs:ro
      - ../data/uploads:/usr/share/nginx/html/assets/flow-images
    networks:
      - zhuangxiu

networks:
  zhuangxiu:
    external: true
