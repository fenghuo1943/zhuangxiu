<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>装修手记 - 清晰装修管家</title>
    <!-- 防止主题闪烁：在 CSS 加载前立即应用保存的主题 -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme_preference');
          if (saved) {
            var pref = JSON.parse(saved);
            var colors = generateColors(pref.primaryColor);
            var root = document.documentElement;
            root.style.setProperty('--theme-primary', colors.primary);
            root.style.setProperty('--theme-primary-deep', colors.primaryDeep);
            root.style.setProperty('--theme-primary-soft', colors.primarySoft);
            root.style.setProperty('--theme-primary-ring', colors.primaryRing);
            root.style.setProperty('--theme-primary-shadow', colors.primaryShadow);
            root.style.setProperty('--fresh-coral', colors.primary);
            root.style.setProperty('--fresh-coral-deep', colors.primaryDeep);
            root.style.setProperty('--fresh-coral-soft', colors.primarySoft);
            root.style.setProperty('--primary', colors.primary);
            root.style.setProperty('--primary-light', colors.primarySoft);
            root.style.setProperty('--fresh-shadow-button', '0 10px 22px ' + colors.primaryShadow);
            if (pref.desktopLayout) root.dataset.desktopLayout = pref.desktopLayout;
            if (pref.mobileLayout) root.dataset.mobileLayout = pref.mobileLayout;
          }
        } catch(e) {}

        function generateColors(hex) {
          var r = parseInt(hex.slice(1, 3), 16);
          var g = parseInt(hex.slice(3, 5), 16);
          var b = parseInt(hex.slice(5, 7), 16);
          var darken = function(amt) {
            return '#' + [Math.max(0, Math.round(r * (1 - amt))), Math.max(0, Math.round(g * (1 - amt))), Math.max(0, Math.round(b * (1 - amt)))].map(function(v) { return v.toString(16).padStart(2, '0'); }).join('');
          };
          var lighten = function(amt) {
            return '#' + [Math.min(255, Math.round(r + (255 - r) * amt)), Math.min(255, Math.round(g + (255 - g) * amt)), Math.min(255, Math.round(b + (255 - b) * amt))].map(function(v) { return v.toString(16).padStart(2, '0'); }).join('');
          };
          var alpha = function(a) {
            return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + a + ')';
          };
          return {
            primary: hex,
            primaryDeep: darken(0.1),
            primarySoft: lighten(0.9),
            primaryRing: alpha(0.12),
            primaryShadow: alpha(0.17)
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
